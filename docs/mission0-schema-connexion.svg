<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 970" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect x="0" y="0" width="740" height="970" fill="#fcfcfb"/>
<rect x="60" y="30" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="55.0" r="14" fill="#2a78d6"/>
<text x="86" y="60.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">1</text>
<text x="112" y="51" font-size="14" fill="#0b0b0b" font-weight="600">Utilisateur</text>
<text x="112" y="68" font-size="12" fill="#52514e">Clic sur « Se connecter » (login-page.html)</text>
<line x1="370.0" y1="80" x2="370.0" y2="98" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="100" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="125.0" r="14" fill="#2a78d6"/>
<text x="86" y="130.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">2</text>
<text x="112" y="121" font-size="14" fill="#0b0b0b" font-weight="600">LoginPageComponent.submit()</text>
<text x="112" y="138" font-size="12" fill="#52514e">Lit le ReactiveForm (email, password)</text>
<line x1="370.0" y1="150" x2="370.0" y2="168" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="170" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="195.0" r="14" fill="#2a78d6"/>
<text x="86" y="200.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">3</text>
<text x="112" y="191" font-size="14" fill="#0b0b0b" font-weight="600">AuthService.login(email, password)</text>
<text x="112" y="208" font-size="12" fill="#52514e">auth.service.ts — construit la requête</text>
<line x1="370.0" y1="220" x2="370.0" y2="238" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="240" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="265.0" r="14" fill="#2a78d6"/>
<text x="86" y="270.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">4</text>
<text x="112" y="261" font-size="14" fill="#0b0b0b" font-weight="600">HttpClient.post('/api/auth/login', …)</text>
<text x="112" y="278" font-size="12" fill="#52514e">+ authInterceptor (pas de token à ce stade)</text>
<line x1="370.0" y1="290" x2="370.0" y2="308" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="335.0" r="14" fill="#2a78d6"/>
<text x="86" y="340.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">5</text>
<text x="112" y="331" font-size="14" fill="#0b0b0b" font-weight="600">Proxy Angular (proxy.conf.json)</text>
<text x="112" y="348" font-size="12" fill="#52514e">/api/*  →  http://localhost:3000</text>
<line x1="370.0" y1="360" x2="370.0" y2="378" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="380" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="405.0" r="14" fill="#2a78d6"/>
<text x="86" y="410.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">6</text>
<text x="112" y="401" font-size="14" fill="#0b0b0b" font-weight="600">Express : POST /api/auth/login</text>
<text x="112" y="418" font-size="12" fill="#52514e">Route publique (pas de JWT requis)</text>
<line x1="370.0" y1="430" x2="370.0" y2="448" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="450" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="475.0" r="14" fill="#2a78d6"/>
<text x="86" y="480.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">7</text>
<text x="112" y="471" font-size="14" fill="#0b0b0b" font-weight="600">Middleware validation + contrôleur</text>
<text x="112" y="488" font-size="12" fill="#52514e">Vérifie email/password, cherche l'utilisateur</text>
<line x1="370.0" y1="500" x2="370.0" y2="518" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="520" width="620" height="50" rx="8" fill="#fdeeea" stroke="#eb6834" stroke-width="1.5"/>
<circle cx="86" cy="545.0" r="14" fill="#eb6834"/>
<text x="86" y="550.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">8</text>
<text x="112" y="541" font-size="14" fill="#0b0b0b" font-weight="600">Mongoose → MongoDB Atlas</text>
<text x="112" y="558" font-size="12" fill="#52514e">User.findOne + comparaison du hash (bcrypt)</text>
<line x1="370.0" y1="570" x2="370.0" y2="588" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="590" width="620" height="50" rx="8" fill="#fdeeea" stroke="#eb6834" stroke-width="1.5"/>
<circle cx="86" cy="615.0" r="14" fill="#eb6834"/>
<text x="86" y="620.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">9</text>
<text x="112" y="611" font-size="14" fill="#0b0b0b" font-weight="600">Réponse 200 { token, user }</text>
<text x="112" y="628" font-size="12" fill="#52514e">Remonte au frontend</text>
<line x1="370.0" y1="640" x2="370.0" y2="658" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="660" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="685.0" r="14" fill="#2a78d6"/>
<text x="86" y="690.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">10</text>
<text x="112" y="681" font-size="14" fill="#0b0b0b" font-weight="600">AuthService — tap(storeAuthentication)</text>
<text x="112" y="698" font-size="12" fill="#52514e">localStorage['gpc_token'] + Signals token/currentUser</text>
<line x1="370.0" y1="710" x2="370.0" y2="728" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="730" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="755.0" r="14" fill="#2a78d6"/>
<text x="86" y="760.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">11</text>
<text x="112" y="751" font-size="14" fill="#0b0b0b" font-weight="600">LoginPageComponent — next()</text>
<text x="112" y="768" font-size="12" fill="#52514e">router.navigateByUrl('/tracks')</text>
<line x1="370.0" y1="780" x2="370.0" y2="798" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="800" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="825.0" r="14" fill="#2a78d6"/>
<text x="86" y="830.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">12</text>
<text x="112" y="821" font-size="14" fill="#0b0b0b" font-weight="600">authGuard sur /tracks</text>
<text x="112" y="838" font-size="12" fill="#52514e">Lit auth.token() → accès autorisé</text>
<line x1="370.0" y1="850" x2="370.0" y2="868" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="870" width="620" height="50" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<circle cx="86" cy="895.0" r="14" fill="#2a78d6"/>
<text x="86" y="900.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">13</text>
<text x="112" y="891" font-size="14" fill="#0b0b0b" font-weight="600">AppComponent (nav)</text>
<text x="112" y="908" font-size="12" fill="#52514e">Réagit au Signal → affiche Profil / Déconnexion</text>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
